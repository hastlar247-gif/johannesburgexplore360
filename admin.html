<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard | Johannesburg Explore 360</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      color: #172033;
    }

    header {
      background: #101c30;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 { margin: 0; font-size: 25px; }
    header p { margin: 8px 0 0; color: #cbd5e1; }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.07);
    }

    input, button {
      padding: 12px;
      border-radius: 7px;
      font-size: 15px;
    }

    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      margin: 9px 0;
    }

    button {
      border: none;
      background: #e6a23c;
      color: #172033;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { opacity: .85; }

    .logout { background: #ef4444; color: white; }
    .confirm { background: #16a34a; color: white; }
    .cancel { background: #dc2626; color: white; }

    .hidden { display: none; }

    .booking {
      border: 1px solid #e2e8f0;
      padding: 18px;
      margin-top: 15px;
      border-radius: 10px;
    }

    .booking p { margin: 7px 0; overflow-wrap: anywhere; }
    .booking button { margin: 6px 6px 0 0; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    #message { color: #b91c1c; }
    #dashboardMessage { color: #475569; }
  </style>
</head>

<body>

<header>
  <h1>Johannesburg Explore 360</h1>
  <p>Private Admin Dashboard</p>
</header>

<main class="container">

  <section id="loginSection" class="card">
    <h2>Administrator Login</h2>
    <p>Sign in to manage your customer bookings.</p>

    <form id="loginForm">
      <input id="email" type="email"
             placeholder="Admin email" required>

      <input id="password" type="password"
             placeholder="Password" required>

      <button type="submit">Log In</button>
    </form>

    <p id="message" role="status"></p>
  </section>

  <section id="dashboardSection" class="hidden">

    <div class="card topbar">
      <h2>Customer Bookings</h2>
      <button class="logout" id="logoutButton">
        Log Out
      </button>
    </div>

    <div class="card">
      <button id="refreshButton">Refresh Bookings</button>
      <p id="dashboardMessage" role="status"></p>
      <div id="bookingsList"></div>
    </div>

  </section>

</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(async function () {
  const loginSection = document.getElementById("loginSection");
  const dashboardSection = document.getElementById("dashboardSection");
  const message = document.getElementById("message");
  const dashboardMessage = document.getElementById("dashboardMessage");
  const bookingsList = document.getElementById("bookingsList");

  if (
    typeof SUPABASE_URL === "undefined" ||
    typeof SUPABASE_ANON_KEY === "undefined" ||
    !window.supabase
  ) {
    message.textContent = "Database configuration is missing.";
    return;
  }

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  function showLogin() {
    loginSection.classList.remove("hidden");
    dashboardSection.classList.add("hidden");
    bookingsList.replaceChildren();
  }

  function showDashboard() {
    loginSection.classList.add("hidden");
    dashboardSection.classList.remove("hidden");
  }

  async function checkAdmin() {
    const { data: userData, error: userError } =
      await db.auth.getUser();

    if (userError || !userData.user) {
      showLogin();
      return false;
    }

    const { data, error } = await db
      .from("admin_users")
      .select("user_id")
      .eq("user_id", userData.user.id)
      .maybeSingle();

    // The admin_users table is intentionally private.
    // Its SELECT permission is revoked, so this check
    // cannot be used as an authorization test.
    // Instead, bookings access is controlled by RLS.
    if (error || !data) {
      // Check authorization through the protected bookings table.
      const result = await db.from("bookings")
        .select("id")
        .limit(1);

      if (result.error) {
        await db.auth.signOut();
        message.textContent = "This account cannot access bookings.";
        showLogin();
        return false;
      }
    }

    showDashboard();
    await loadBookings();
    return true;
  }

  async function loadBookings() {
    dashboardMessage.textContent = "Loading bookings...";
    bookingsList.replaceChildren();

    const { data, error } = await db
      .from("bookings")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      dashboardMessage.textContent =
        "Unable to load bookings: " + error.message;
      return;
    }

    dashboardMessage.textContent =
      data.length + " booking(s) found.";

    for (const booking of data) {
      const card = document.createElement("div");
      card.className = "booking";

      const fields = [
        ["Customer", booking.customer_name],
        ["Email", booking.customer_email],
        ["Phone", booking.customer_phone || "Not provided"],
        ["Tour", booking.tour_name],
        ["Date", booking.tour_date],
        ["Guests", booking.number_of_guests],
        ["Status", booking.booking_status]
      ];

      for (const [label, value] of fields) {
        const p = document.createElement("p");
        const strong = document.createElement("strong");
        strong.textContent = label + ": ";
        p.append(strong, document.createTextNode(String(value ?? "")));
        card.appendChild(p);
      }

      const confirm = document.createElement("button");
      confirm.className = "confirm";
      confirm.textContent = "Confirm";

      const cancel = document.createElement("button");
      cancel.className = "cancel";
      cancel.textContent = "Cancel";

      confirm.addEventListener("click", () =>
        updateBooking(booking.id, "confirmed")
      );

      cancel.addEventListener("click", () =>
        updateBooking(booking.id, "cancelled")
      );

      card.append(confirm, cancel);
      bookingsList.appendChild(card);
    }
  }

  async function updateBooking(id, status) {
    const { data, error } = await db
      .from("bookings")
      .update({ booking_status: status })
      .eq("id", id)
      .select("id");

    if (error || !data || data.length !== 1) {
      dashboardMessage.textContent =
        "Could not update booking. Please try again.";
      return;
    }

    await loadBookings();
  }

  document.getElementById("loginForm")
    .addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Signing in...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent = "";
      await checkAdmin();
    });

  document.getElementById("logoutButton")
    .addEventListener("click", async () => {
      await db.auth.signOut();
      showLogin();
    });

  document.getElementById("refreshButton")
    .addEventListener("click", loadBookings);

  const { data: sessionData } = await db.auth.getSession();

  if (sessionData.session) {
    await checkAdmin();
  } else {
    showLogin();
  }
})();
</script>

</body>
</html>
